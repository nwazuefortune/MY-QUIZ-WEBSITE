<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-box">
        <h1>My Quiz App</h1>
        <div class="top">
            <p id="question-number">Question 1</p>
            <p>Time: <span id="time">10</span>s</p>
        </div>

        <h2 id="question">Question will appear here</h2>

        <div id="answers">
            <button class="answer">Option A</button>
            <button class="answer">Option B</button>
            <button class="answer">Option C</button>
            <button class="answer">Option D</button>
        </div>

        <p id="message"></p>
        <button id="next-button">Next</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
